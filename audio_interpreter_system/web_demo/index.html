<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>同声传译音频拦截系统 - Web演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1200px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .audio-source-selector {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .audio-source-selector h3 {
            margin-bottom: 15px;
            color: #495057;
        }

        .source-options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .source-option {
            flex: 1;
            min-width: 200px;
            padding: 15px;
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .source-option:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .source-option.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover {
            background: #e53e3e;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .language-selector {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 30px;
        }

        select {
            padding: 10px 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            cursor: pointer;
        }

        .panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .panel {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            min-height: 200px;
        }

        .panel h3 {
            margin-bottom: 15px;
            color: #495057;
        }

        .panel-content {
            background: white;
            padding: 15px;
            border-radius: 8px;
            min-height: 150px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            line-height: 1.6;
        }

        .status {
            padding: 20px;
            background: #e3f2fd;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .status-label {
            font-weight: 600;
            color: #495057;
        }

        .status-value {
            color: #667eea;
        }

        .visualizer {
            width: 100%;
            height: 100px;
            background: #1a202c;
            border-radius: 8px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .panels {
                grid-template-columns: 1fr;
            }
        }

        .error-message {
            background: #fee;
            color: #c00;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎧 同声传译音频拦截系统</h1>
        <p class="subtitle">演示如何拦截音频流并实现实时翻译</p>

        <div class="audio-source-selector">
            <h3>选择音频源</h3>
            <div class="source-options">
                <div class="source-option active" data-source="microphone">
                    <h4>🎤 麦克风输入</h4>
                    <p>捕获麦克风音频</p>
                </div>
                <div class="source-option" data-source="system">
                    <h4>🔊 系统音频</h4>
                    <p>捕获系统播放音频</p>
                </div>
                <div class="source-option" data-source="tab">
                    <h4>📑 标签页音频</h4>
                    <p>捕获浏览器标签音频</p>
                </div>
            </div>
        </div>

        <div class="language-selector">
            <label>源语言:</label>
            <select id="sourceLang">
                <option value="zh-CN">中文</option>
                <option value="en-US">英语</option>
                <option value="ja-JP">日语</option>
                <option value="ko-KR">韩语</option>
                <option value="fr-FR">法语</option>
            </select>
            <label>目标语言:</label>
            <select id="targetLang">
                <option value="en-US">英语</option>
                <option value="zh-CN">中文</option>
                <option value="ja-JP">日语</option>
                <option value="ko-KR">韩语</option>
                <option value="fr-FR">法语</option>
            </select>
        </div>

        <div class="controls">
            <button id="startBtn" class="btn-primary">开始捕获音频</button>
            <button id="stopBtn" class="btn-danger" disabled>停止捕获</button>
            <button id="testBtn" class="btn-primary">测试音频播放</button>
        </div>

        <div class="status">
            <div class="status-item">
                <span class="status-label">捕获状态:</span>
                <span class="status-value" id="captureStatus">未开始</span>
            </div>
            <div class="status-item">
                <span class="status-label">音频源:</span>
                <span class="status-value" id="audioSource">麦克风输入</span>
            </div>
            <div class="status-item">
                <span class="status-label">采样率:</span>
                <span class="status-value" id="sampleRate">-</span>
            </div>
            <div class="status-item">
                <span class="status-label">音频级别:</span>
                <span class="status-value" id="audioLevel">0 dB</span>
            </div>
        </div>

        <div class="panels">
            <div class="panel">
                <h3>📝 原文识别</h3>
                <div class="panel-content" id="originalText">
                    等待音频输入...
                </div>
            </div>
            <div class="panel">
                <h3>🌐 翻译结果</h3>
                <div class="panel-content" id="translatedText">
                    等待翻译...
                </div>
            </div>
        </div>

        <div class="panel">
            <h3>📊 音频波形可视化</h3>
            <canvas class="visualizer" id="visualizer"></canvas>
        </div>

        <div class="error-message" id="errorMessage"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
